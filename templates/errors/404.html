
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#142D4E">

    <title>404 - Halaman Tidak Ditemukan | ACTRACE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/errors.css') }}">

    <script src="{{ url_for('static', filename='js/errors.js') }}"
            defer></script>
</head>

<body class="error-page">

    <main class="error-container">
        <section class="error-card">

            <div class="error-brand">
                <span class="brand-mark">A</span>
                <span>ACTRACE</span>
            </div>

            <div class="error-illustration error-404">
                <span class="error-icon">?</span>
            </div>

            <p class="error-label">PAGE NOT FOUND</p>

            <h1 class="error-code">404</h1>

            <h2>Halaman Tidak Ditemukan</h2>

            <p class="error-description">
                Halaman yang kamu cari mungkin telah dipindahkan,
                dihapus, atau alamat yang dimasukkan tidak benar.
            </p>

            <div class="error-actions">
                <a href="{{ url_for('index') }}"
                   class="error-button primary">
                    Kembali ke Beranda
                </a>

                <button type="button"
                        class="error-button secondary"
                        data-go-back>
                    Halaman Sebelumnya
                </button>
            </div>

            <p class="error-reference">
                HTTP ERROR 404
            </p>

        </section>

        <footer class="error-footer">
            &copy; 2026 ACTRACE. Every Activity Leaves a Trace.
        </footer>
    </main>

</body>
</html>
